name: Build Chat UI

# Builds the React chat app in frontend/ directly into backend/app/static/dist/
# (served by the backend at /). The vite config targets dist/ directly — no
# copy step needed. No local Node needed; GitHub is the build machine.

on:
  push:
    branches: [feat/react-chat]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Build bundle (outputs to ../backend/app/static/dist)
        run: npm run build

      - name: Commit built assets
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f backend/app/static/dist
          if git diff --cached --quiet; then
            echo "No changes to dist"
          else
            git commit -m "build: publish chat UI to dist [skip ci]"
            git push
          fi
