name: Build Chat UI

# Builds the React chat app in frontend/ and publishes it into
# backend/app/static/dist/ (served by the backend at /).
#
# This workflow uses Vite to build the frontend and outputs directly
# to backend/app/static/dist/ via vite.config.ts.
#
# Two hygiene rules are enforced here:
#   1. The generated destination is *replaced*, not merged. Vite does not empty
#      an outDir that lives outside the project root, so stale assets from
#      earlier builds used to accumulate in git forever.
#   2. Dependencies install with `npm ci` from a committed lockfile. The
#      lockfile is generated here on the first run if it is missing.
#
# Generated commits carry [skip ci] so publishing never retriggers this
# workflow.

on:
  push:
    branches: [feat/react-chat]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ---- Lockfile -------------------------------------------------------
      - name: Sync lockfile with package.json
        working-directory: frontend
        run: |
          set -euo pipefail
          if [ -f package-lock.json ] && npm ci --dry-run --no-audit --no-fund >/dev/null 2>&1; then
            echo "package-lock.json is in sync with package.json; leaving it untouched."
          else
            echo "Lockfile missing or out of sync; regenerating from package.json."
            npm install --package-lock-only --no-audit --no-fund
            test -f package-lock.json
          fi

      - name: Commit lockfile
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain frontend/package-lock.json)" ]; then
            git add frontend/package-lock.json
            git commit -m "chore(frontend): commit generated package-lock.json [skip ci]"
            git push
            echo "Lockfile committed."
          else
            echo "Lockfile unchanged; nothing to commit."
          fi

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      # ---- Build ---------------------------------------------------------
      # Vite builds directly to backend/app/static/dist/ per vite.config.ts.
      # We validate the output exists before committing.
      - name: Build
        working-directory: frontend
        run: npm run build

      # ---- Validate output -----------------------------------------------
      - name: Validate build output
        run: |
          set -euo pipefail
          DEST="${{ github.workspace }}/backend/app/static/dist"
          test -f "$DEST/index.html" || { echo "index.html missing"; exit 1; }
          test -d "$DEST/assets" || { echo "assets/ missing"; exit 1; }
          echo "Build output validated."

      # ---- Publish --------------------------------------------------------
      - name: Commit built assets
        working-directory: ${{ github.workspace }}
        env:
          DEST: ${{ github.workspace }}/backend/app/static/dist
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -f "$DEST"
          if git diff --cached --quiet; then
            echo "No changes to dist"
          else
            git commit -m "build: publish chat UI to dist [skip ci]"
            git push
          fi
