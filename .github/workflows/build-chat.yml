name: Build Chat UI

# Builds the React chat demo in frontendn/ and publishes the multi-file bundle
# (index.html + assets/*.js + assets/*.css) into backend/app/static/dist/demo1/
# (served by the backend at /demo1/). No local Node needed — GitHub is the build machine.

on:
  push:
    branches: [feat/react-chat]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontendn
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Build bundle
        run: npm run build

      - name: Publish chat UI to demo1
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf backend/app/static/dist/demo1
          mkdir -p backend/app/static/dist
          cp -r frontendn/dist backend/app/static/dist/demo1
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/app/static/dist/demo1
          if git diff --cached --quiet; then
            echo "No changes to demo1"
          else
            git commit -m "build: publish chat UI to demo1 [skip ci]"
            git push
          fi
