name: Build Chat UI (frontendn)

# Builds the React chat app in frontendn/ and publishes it into
# backend/app/static/dist/ (served by the backend at /).
#
# This is the assistant-ui primitives rewrite. It mirrors build-chat.yml
# (which builds frontend/) but points at frontendn/.
#
# Trigger: manual (workflow_dispatch) only for now. build-chat.yml still
# exists and both workflows would race to write backend/app/static/dist if
# this one also fired on push. Once build-chat.yml is deleted, switch this
# workflow to:
#   on:
#     push:
#       branches: [feat/react-chat]
#
# Two hygiene rules are enforced here:
#   1. The generated destination is *replaced*, not merged. Vite does not empty
#      an outDir that lives outside the project root, so stale assets from
#      earlier builds used to accumulate in git forever.
#   2. Dependencies install with `npm ci` from a committed lockfile. The
#      lockfile is generated here on the first run if it is missing.
#
# Generated commits carry [skip ci] so publishing never retriggers this
# workflow.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ---- Lockfile -------------------------------------------------------
      # Generated in CI (never locally) so it matches the project's declared
      # Node/npm environment. `npm ci` below never rewrites it, so an unchanged
      # lockfile is not recommitted on every run.
      # Regenerated whenever it is missing OR out of sync with package.json.
      # `npm ci` refuses to run against a stale lockfile, so a dependency
      # change has to refresh it here instead of failing the install below.
      # An unchanged lockfile still is not recommitted: the dry run proves it
      # already satisfies package.json, so this step leaves it untouched.
      - name: Sync lockfile with package.json
        working-directory: frontendn
        run: |
          set -euo pipefail
          if [ -f package-lock.json ] && npm ci --dry-run --no-audit --no-fund >/dev/null 2>&1; then
            echo "package-lock.json is in sync with package.json; leaving it untouched."
          else
            echo "Lockfile missing or out of sync; regenerating from package.json."
            npm install --package-lock-only --no-audit --no-fund
            test -f package-lock.json
          fi

      - name: Commit lockfile
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain frontendn/package-lock.json)" ]; then
            git add frontendn/package-lock.json
            git commit -m "chore(frontendn): commit generated package-lock.json [skip ci]"
            git push
            echo "Lockfile committed."
          else
            echo "Lockfile unchanged; nothing to commit."
          fi

      - name: Install dependencies
        working-directory: frontendn
        run: npm ci

      - name: Type check
        working-directory: frontendn
        run: npm run typecheck

      # ---- Build to staging ----------------------------------------------
      # Build out of the way first so the currently packaged output stays
      # usable if the build fails.
      - name: Build bundle to staging directory
        working-directory: frontendn
        run: npx vite build --outDir dist-staging --emptyOutDir

      # ---- Validate and replace ------------------------------------------
      - name: Replace generated dist with staging output
        working-directory: ${{ github.workspace }}
        env:
          STAGING: ${{ github.workspace }}/frontendn/dist-staging
          DEST: ${{ github.workspace }}/backend/app/static/dist
        run: |
          set -euo pipefail

          echo "STAGING=$STAGING"
          echo "DEST=$DEST"

          # Guard: only ever operate on these two exact, fully resolved paths.
          # Refuse anything empty, relative, or not under the workspace.
          for p in "$STAGING" "$DEST"; do
            case "$p" in
              "$GITHUB_WORKSPACE"/frontendn/dist-staging) ;;
              "$GITHUB_WORKSPACE"/backend/app/static/dist) ;;
              *) echo "Refusing unexpected path: $p" >&2; exit 1 ;;
            esac
            case "$p" in
              *".."*) echo "Refusing path containing '..': $p" >&2; exit 1 ;;
            esac
            if [ "$p" = "$GITHUB_WORKSPACE" ]; then
              echo "Refusing to operate on the repository root." >&2; exit 1
            fi
          done

          # The staging output must be a complete build before we touch dist.
          test -f "$STAGING/index.html"
          test -d "$STAGING/assets"

          # Every asset referenced by index.html must exist in staging.
          refs=$(grep -oE '(src|href)="\./[^"]+"' "$STAGING/index.html" \
                 | sed -E 's/.*"\.\/([^"]+)"/\1/' | sort -u)
          test -n "$refs"
          for r in $refs; do
            if [ ! -f "$STAGING/$r" ]; then
              echo "index.html references a missing file: $r" >&2
              exit 1
            fi
            echo "  ok: $r"
          done

          before=$(find "$DEST" -type f 2>/dev/null | wc -l)
          echo "Assets in destination before cleanup: $before"

          # Replace the destination wholesale so stale files cannot survive.
          rm -rf -- "$DEST"
          mkdir -p -- "$DEST"
          cp -R "$STAGING"/. "$DEST"/

          after=$(find "$DEST" -type f | wc -l)
          echo "Assets in destination after cleanup: $after"

          # Nothing extra may remain: destination must match staging exactly.
          stage_count=$(find "$STAGING" -type f | wc -l)
          if [ "$after" -ne "$stage_count" ]; then
            echo "Destination ($after) does not match staging ($stage_count)." >&2
            exit 1
          fi

          rm -rf -- "$STAGING"

      # ---- Publish --------------------------------------------------------
      - name: Commit built assets
        working-directory: ${{ github.workspace }}
        env:
          DEST: ${{ github.workspace }}/backend/app/static/dist
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -A on an explicit path stages additions, modifications AND the
          # deletions produced by the cleanup above.
          git add -A -f "$DEST"
          if git diff --cached --quiet; then
            echo "No changes to dist"
          else
            git commit -m "build: publish frontendn chat UI to dist [skip ci]"
            git push
          fi