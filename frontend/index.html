<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#151313" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fdfcfa" media="(prefers-color-scheme: light)" />
    <title>RTAI Chat</title>
    <script>
      // Applies the theme before first paint so the page never flashes the
      // wrong colours. Must stay inline and synchronous, and must mirror the
      // logic in src/lib/theme.ts (stored choice, else system preference).
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored === "dark" || stored === "light"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.classList.toggle("dark", theme === "dark");
        } catch (error) {
          /* Storage or matchMedia unavailable; CSS falls back to the system. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
