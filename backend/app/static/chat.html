<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTAI Chat</title>
    <link rel="stylesheet" href="chat.css">
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>RTAI</h1>
                <button class="icon-btn" onclick="toggleTheme()" title="Toggle theme">
                    <svg class="icon" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </button>
            </div>

            <!-- Project Folder Input -->
            <div class="project-folder">
                <label>Project Folder:</label>
                <input type="text" id="projectFolder" placeholder="Enter project path..." value="">
            </div>

            <div class="sidebar-search">
                <input type="text" placeholder="Search sessions..." id="searchInput">
            </div>

            <div class="session-list" id="sessionList">
                <div class="session-item active" onclick="selectSession(this, 'Current')">
                    <span class="session-title">Current Session</span>
                </div>
            </div>

            <div class="sidebar-footer">
                <button class="icon-btn" onclick="connect()" title="Reconnect">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M1 4v6h6"></path>
                        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                    </svg>
                </button>
                <button class="icon-btn" onclick="newSession()" title="New Session">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                    </svg>
                </button>
                <button class="icon-btn" title="Settings">
                    <svg class="icon" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
            </div>
        </aside>

        <!-- Main -->
        <main class="main">
            <!-- Header -->
            <header class="header">
                <div class="header-title" id="headerTitle">Current Session</div>
                <div class="header-controls">
                    <button class="model-picker" id="modelPicker" onclick="showModelPicker()">
                        <svg class="icon" viewBox="0 0 24 24">
                            <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                            <path d="M2 17l10 5 10-5"></path>
                            <path d="M2 12l10 5 10-5"></path>
                        </svg>
                        <span id="modelName">Select Model</span>
                    </button>
                </div>
            </header>

            <!-- Chat -->
            <div class="chat">
                <div class="messages" id="messages">
                    <div class="message agent">
                        <div class="avatar">AI</div>
                        <div class="bubble">Enter a project folder path and press Enter to connect.</div>
                    </div>
                </div>

                <!-- Composer -->
                <div class="composer">
                    <div class="composer-card">
                        <div class="composer-body">
                            <textarea class="composer-input" id="input" placeholder="Ask anything... (Shift+Enter for newline)" rows="2"></textarea>
                        </div>
                        <div class="composer-footer">
                            <div class="footer-left">
                                <button class="ctrl-btn" title="Attach file">
                                    <svg class="icon" viewBox="0 0 24 24">
                                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                                    </svg>
                                </button>
                                <button class="ctrl-btn" title="Focus mode">
                                    <svg class="icon" viewBox="0 0 24 24">
                                        <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path>
                                    </svg>
                                </button>
                                <button class="ctrl-btn" title="Auto-accept">
                                    <svg class="icon" viewBox="0 0 24 24">
                                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                                    </svg>
                                </button>
                            </div>
                            <div class="footer-right">
                                <button class="ctrl-btn" title="Stop" id="stopBtn" style="display: none;">
                                    <svg class="icon" viewBox="0 0 24 24">
                                        <rect x="6" y="6" width="12" height="12" rx="2"></rect>
                                    </svg>
                                </button>
                                <button class="ctrl-btn" title="Thinking" id="thinkingBtn">
                                    <svg class="icon" viewBox="0 0 24 24">
                                        <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2z"></path>
                                        <path d="M12 8v4l3 3"></path>
                                    </svg>
                                    <span class="btn-label">Off</span>
                                </button>
                                <button class="ctrl-btn" title="Model" id="modelBtn">
                                    <svg class="icon" viewBox="0 0 24 24">
                                        <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                                        <path d="M2 17l10 5 10-5"></path>
                                        <path d="M2 12l10 5 10-5"></path>
                                    </svg>
                                    <span class="btn-label">Model</span>
                                </button>
                                <button class="ctrl-btn" title="Agent" id="agentBtn">
                                    <svg class="icon" viewBox="0 0 24 24">
                                        <circle cx="12" cy="12" r="3"></circle>
                                        <path d="M12 1v6M12 17v6M4.22 4.22l4.24 4.24M15.54 15.54l4.24 4.24M1 12h6M17 12h6M4.22 19.78l4.24-4.24M15.54 8.46l4.24-4.24"></path>
                                    </svg>
                                    <span class="btn-label">Agent</span>
                                </button>
                                <button class="ctrl-btn" title="Dictation">
                                    <svg class="icon" viewBox="0 0 24 24">
                                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                                        <line x1="12" y1="19" x2="12" y2="23"></line>
                                        <line x1="8" y1="23" x2="16" y2="23"></line>
                                    </svg>
                                </button>
                                <button class="send-btn" onclick="sendMessage()" title="Send" id="sendBtn">
                                    <svg class="icon" viewBox="0 0 24 24">
                                        <line x1="22" y1="2" x2="11" y2="13"></line>
                                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Status Bar -->
            <div class="status-bar">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Disconnected</span>
                <span id="cwdText" class="cwd-text"></span>
            </div>
        </main>
    </div>

    <!-- Agent Dropdown -->
    <div class="dropdown" id="agentDropdown">
        <div class="dropdown-content" id="agentDropdownContent"></div>
    </div>

    <!-- Model Dropdown -->
    <div class="dropdown" id="modelDropdown">
        <div class="dropdown-content" id="modelDropdownContent"></div>
    </div>

    <!-- Thinking Dropdown -->
    <div class="dropdown" id="thinkingDropdown">
        <div class="dropdown-content" id="thinkingDropdownContent"></div>
    </div>

    <script src="chat.js"></script>
</body>
</html>
